<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact us</title>
  <meta name="description" content="Contact form: send a message and choose how we reply.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <h1>My Blog</h1>
    <nav aria-label="Main">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
      <a href="components.html">Components</a>
    </nav>
  </header>

  <main class="container" id="main">
    <h2>Contact Us</h2>
    <p>Please fill out this form, and we will contact you as soon as possible.</p>

    <form class="form" action="#" method="POST">
      <div class="field">
        <label for="fullName">Full Name *</label>
        <input class="input" type="text" id="fullName" name="fullName" autocomplete="name" placeholder="menna mohamed" required>
      </div>

      <div class="field">
        <label for="email">Email Address *</label>
        <input class="input" type="email" id="email" name="email" autocomplete="email" placeholder="menna@example.com" required>
      </div>

      <div class="field">
        <label for="phone">Phone / WhatsApp number *</label>
        <input class="input" type="tel" id="phone" name="phone" autocomplete="tel" placeholder="0123456789" required>
      </div>

      <div class="field">
        <label for="date">Preferred response Date</label>
        <input class="input" type="date" id="date" name="date">
      </div>

      <div class="field">
        <label for="dept">Department *</label>
        <select class="select" id="dept" name="dept" required>
          <option value="">-- Select a Department --</option>
          <option value="general inquiry">General inquiry</option>
          <option value="technical support">Technical support</option>
        </select>
      </div>

      <fieldset>
        <legend>Preferred Contact Method</legend>
        <div class="choice">
          <input type="radio" id="emailMethod" name="method" value="email">
          <label for="emailMethod">Email</label>
        </div>
        <div class="choice">
          <input type="radio" id="phoneMethod" name="method" value="phone">
          <label for="phoneMethod">Phone Call</label>
        </div>
        <div class="choice">
          <input type="radio" id="whatsAppMethod" name="method" value="WhatsApp">
          <label for="whatsAppMethod">WhatsApp</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Services of Interest</legend>
        <div class="choice">
          <input type="checkbox" id="c1" name="services" value="ai">
          <label for="c1">AI &amp; Machine learning</label>
        </div>
        <div class="choice">
          <input type="checkbox" id="c2" name="services" value="web">
          <label for="c2">Web Development</label>
        </div>
        <div class="choice">
          <input type="checkbox" id="c3" name="services" value="backend">
          <label for="c3">Backend</label>
        </div>
        <div class="choice">
          <input type="checkbox" id="c4" name="services" value="newsletter">
          <label for="c4">Subscribe to Newsletter</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="msg">Message (Details) *</label>
        <textarea class="textarea" id="msg" name="msg" rows="5" placeholder="Type your message here..." required></textarea>
      </div>

      <div>
        <button class="btn" type="submit">Send the Message</button>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 My Blog</p>
  </footer>
</body>
</html>
